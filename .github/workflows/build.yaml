name: Build & Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_release:
    name: Build & Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.1"
          channel: stable
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Generate localizations
        run: dart run intl_utils:generate

      # ─────────────────────────────────────────────
      # VERSION BUMP (inside same job — SAFE)
      # ─────────────────────────────────────────────
      - name: Bump version
        id: version
        run: |
          CURRENT=$(grep '^version:' pubspec.yaml | sed 's/version: //')
          VERSION=$(echo $CURRENT | cut -d'+' -f1)
          BUILD=$(echo $CURRENT | cut -d'+' -f2)
          NEW_BUILD=$((BUILD + 1))
          NEW_FULL="${VERSION}+${NEW_BUILD}"

          sed -i "s/^version: .*/version: ${NEW_FULL}/" pubspec.yaml

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "build=${NEW_BUILD}" >> $GITHUB_OUTPUT

      # ─────────────────────────────────────────────
      # CHANGELOG
      # ─────────────────────────────────────────────
      - name: Generate CHANGELOG
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || git rev-list --max-parents=0 HEAD)

          echo "## Release Notes" > CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "**Build:** ${{ steps.version.outputs.build }}" >> CHANGELOG.md
          echo "" >> CHANGELOG.md

          git log ${PREV_TAG}..HEAD --pretty=format:"- %s" >> CHANGELOG.md

      # ─────────────────────────────────────────────
      # BUILD APK
      # ─────────────────────────────────────────────
      - name: Build APK
        run: flutter build apk --release

      - name: Rename APK
        run: |
          V=${{ steps.version.outputs.version }}
          B=${{ steps.version.outputs.build }}

          mv build/app/outputs/flutter-apk/app-release.apk \
             flutter_forge-v${V}+${B}.apk

      # ─────────────────────────────────────────────
      # RELEASE
      # ─────────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}+${{ steps.version.outputs.build }}
          name: "v${{ steps.version.outputs.version }} (build ${{ steps.version.outputs.build }})"
          body_path: CHANGELOG.md
          files: flutter_forge-v*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}