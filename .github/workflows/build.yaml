# Runs when code is pushed/merged to master
# Builds release APK and attaches it to a GitHub Release

name: Build & Release

on:
  push:
    branches:
      - master

# Cancel previous runs if new push comes in
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Job 1: Bump build number in pubspec.yaml ──────────────────
  version_bump:
    name: Bump Version
    runs-on: ubuntu-latest
    permissions:
      contents: write

    outputs:
      version: ${{ steps.bump.outputs.version }}
      build: ${{ steps.bump.outputs.build }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump build number
        id: bump
        run: |
          CURRENT=$(grep '^version:' pubspec.yaml | sed 's/version: //')
          VERSION=$(echo $CURRENT | cut -d'+' -f1)
          BUILD=$(echo $CURRENT | cut -d'+' -f2)
          NEW_BUILD=$((BUILD + 1))
          NEW_FULL="${VERSION}+${NEW_BUILD}"
          sed -i "s/^version: .*/version: ${NEW_FULL}/" pubspec.yaml
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "build=${NEW_BUILD}" >> $GITHUB_OUTPUT
          echo "✅ Bumped: ${CURRENT} → ${NEW_FULL}"

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml
          git commit -m "chore: bump build number to ${{ steps.bump.outputs.build }} [skip ci]"
          git push

  # ── Job 2: Build APK ──────────────────────────────────────────
  build_apk:
    name: Build APK
    runs-on: ubuntu-latest
    needs: version_bump

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Pull latest
        run: git pull origin master

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.1"
          channel: stable
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Create .env from GitHub secrets
      - name: Create .env
        run: |
          echo "BASE_URL=${{ secrets.BASE_URL }}" > .env
          echo "GRAPHQL_URL=${{ secrets.GRAPHQL_URL }}" >> .env

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build APK
        run: flutter build apk --release

      - name: Rename APK
        run: |
          V=${{ needs.version_bump.outputs.version }}
          B=${{ needs.version_bump.outputs.build }}
          mv build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/flutter_forge-v${V}+${B}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version_bump.outputs.version }}+${{ needs.version_bump.outputs.build }}
          name: "v${{ needs.version_bump.outputs.version }} (build ${{ needs.version_bump.outputs.build }})"
          body: |
            **Version:** ${{ needs.version_bump.outputs.version }}
            **Build:** ${{ needs.version_bump.outputs.build }}
            **Commit:** ${{ github.sha }}

            Download the APK below and install on your Android device.
          files: build/app/outputs/flutter-apk/flutter_forge-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
```