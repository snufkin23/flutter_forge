# Runs when code is pushed/merged to master
# Builds release APK and attaches it to a GitHub Release

name: Build & Release

on:
  push:
    branches:
      - master

# Cancel previous runs if new push comes in
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Job 1: Bump build number in pubspec.yaml ──────────────────
  version_bump:
    name: Bump Version
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to push commit back

    outputs:
      # Pass version info to next job
      version: ${{ steps.bump.outputs.version }}
      build: ${{ steps.bump.outputs.build }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump build number
        id: bump
        run: |
          # Read version from pubspec.yaml e.g. "1.0.0+5"
          CURRENT=$(grep '^version:' pubspec.yaml | sed 's/version: //')

          # Split into version and build number
          VERSION=$(echo $CURRENT | cut -d'+' -f1)   # "1.0.0"
          BUILD=$(echo $CURRENT | cut -d'+' -f2)      # "5"

          # Increment build number by 1
          NEW_BUILD=$((BUILD + 1))                     # "6"
          NEW_FULL="${VERSION}+${NEW_BUILD}"           # "1.0.0+6"

          # Write back to pubspec.yaml
          sed -i "s/^version: .*/version: ${NEW_FULL}/" pubspec.yaml

          # Pass to next job via outputs
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "build=${NEW_BUILD}" >> $GITHUB_OUTPUT

          echo "✅ Bumped: ${CURRENT} → ${NEW_FULL}"

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml
          # [skip ci] prevents this commit from triggering another build
          git commit -m "chore: bump build number to ${{ steps.bump.outputs.build }} [skip ci]"
          git push

  # ── Job 2: Build APK ──────────────────────────────────────────
  build_apk:
    name: Build APK
    runs-on: ubuntu-latest
    needs: version_bump  # wait for version bump to finish first

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Pull latest so we have the bumped pubspec.yaml
      - name: Pull latest
        run: git pull origin master

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.1"
          channel: stable
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Create .env
        run: echo "GRAPHQL_URL=${{ secrets.GRAPHQL_URL }}" > .env

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      # Build release APK (unsigned — fine for internal testing)
      - name: Build APK
        run: flutter build apk --release

      # Rename APK to include version e.g. flutter_forge-v1.0.0+6.apk
      - name: Rename APK
        run: |
          V=${{ needs.version_bump.outputs.version }}
          B=${{ needs.version_bump.outputs.build }}
          mv build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/flutter_forge-v${V}+${B}.apk

      # Upload APK to GitHub Release
      # Find it at: Repo → Releases → latest
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version_bump.outputs.version }}+${{ needs.version_bump.outputs.build }}
          name: "v${{ needs.version_bump.outputs.version }} (build ${{ needs.version_bump.outputs.build }})"
          body: |
            **Version:** ${{ needs.version_bump.outputs.version }}
            **Build:** ${{ needs.version_bump.outputs.build }}
            **Commit:** ${{ github.sha }}

            Download the APK below and install on your Android device.
          files: build/app/outputs/flutter-apk/flutter_forge-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}